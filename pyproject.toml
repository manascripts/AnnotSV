[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "annotsv"
dynamic = ["version"]
description = "Structural variation annotation and ranking (Python port of AnnotSV)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.9"

# "annotsv" replaces bin/AnnotSV ("python -m annotsv" also works). bin/AnnotSV
# is the Tcl reference and is not installed by pip; do not "make install" the
# Tcl version into the same prefix on a case-insensitive file system (macOS),
# where bin/AnnotSV and bin/annotsv are the same file.
[project.scripts]
annotsv = "annotsv.cli:main"
annotsv-install = "annotsv.install:main"
annotsv-liftover = "annotsv.liftover:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "annotsv.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

# Non-Python files AnnotSV reads at run time, installed under sys.prefix with
# the Makefile layout (default_install_dir() finds them there). Annotations
# are not packaged: see "annotsv-install".
[tool.setuptools.data-files]
"etc/AnnotSV" = ["etc/AnnotSV/configfile", "etc/AnnotSV/application.properties"]
"share/doc/AnnotSV" = ["commandLineOptions.txt", "License.txt", "changeLog.txt"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["src"]
